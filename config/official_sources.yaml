jurisdictions:
  mainland_china:
    allow_suffixes:
      - .gov.cn
      - .edu.cn
    deny_domains:
      - baidu.com
      - weixin.qq.com
      - sohu.com
      - 163.com
      - sina.com.cn
  hong_kong:
    allow_suffixes:
      - .gov.hk
      - .edu.hk
    deny_domains:
      - weixin.qq.com
      - jobsdb.com
      - linkedin.com
  macau:
    allow_suffixes:
      - .gov.mo
      - .edu.mo
    deny_domains:
      - weixin.qq.com
      - linkedin.com
  singapore:
    allow_suffixes:
      - .gov.sg
      - .edu.sg
    deny_domains:
      - linkedin.com
      - mycareersfuture.gov.sg.external.example

